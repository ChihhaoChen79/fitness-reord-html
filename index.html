/* ============================== 工具 ============================== */
function uid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function nowISO(){ return new Date().toISOString(); }
function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return n < 10 ? '0'+n : ''+n; }
function fmtDate(d){
  d = new Date(d);
  return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
}
function fmtDateShort(d){
  d = new Date(d);
  return `${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
}
function fmtTime(d){
  d = new Date(d);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtDuration(min){
  min = Math.round(min);
  if (min < 60) return `${min} 分鐘`;
  const h = Math.floor(min/60), m = min % 60;
  return `${h} 小時 ${m} 分鐘`;
}
function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}
function dateKey(d){
  d = new Date(d);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function monthKey(d){
  d = new Date(d);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
}
function toTimeInputValue(d){
  d = new Date(d);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function combineDateTimeLocal(dateStr, timeStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const [hh,mm] = (timeStr||'08:00').split(':').map(Number);
  return new Date(y, m-1, d, hh, mm, 0, 0).toISOString();
}
function isoWeekKey(d){
  d = new Date(d);
  const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (tmp.getUTCDay() + 6) % 7;
  tmp.setUTCDate(tmp.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(tmp.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((tmp - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return `${tmp.getUTCFullYear()}-W${pad2(week)}`;
}

/* ---- 單位換算：內部一律以公制(kg / km)儲存，顯示時依設定換算 ---- */
const KG_PER_LB = 0.45359237;
const KM_PER_MI = 1.609344;
function unit(){ return State.settings.unit; }
function weightLabel(){ return unit()==='imperial' ? 'lb' : 'kg'; }
function distanceLabel(){ return unit()==='imperial' ? 'mi' : 'km'; }
function toDisplayWeight(kg){
  if (kg === undefined || kg === null || kg === '') return '';
  const v = unit()==='imperial' ? kg / KG_PER_LB : kg;
  return Math.round(v*100)/100;
}
function toStoreWeight(display){
  if (display === undefined || display === null || display === '') return undefined;
  const n = parseFloat(display); if (isNaN(n)) return undefined;
  return unit()==='imperial' ? n * KG_PER_LB : n;
}
function toDisplayDistance(km){
  if (km === undefined || km === null || km === '') return '';
  const v = unit()==='imperial' ? km / KM_PER_MI : km;
  return Math.round(v*100)/100;
}
function toStoreDistance(display){
  if (display === undefined || display === null || display === '') return undefined;
  const n = parseFloat(display); if (isNaN(n)) return undefined;
  return unit()==='imperial' ? n * KM_PER_MI : n;
}

/* ============================== IndexedDB ============================== */
const DB_NAME = 'fitnessTrackerDB';
const DB_VERSION = 1;
const STORES = ['exercises','templates','records','bodyMetrics','tags'];
let dbInstance = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      STORES.forEach(name => {
        if (!db.objectStoreNames.contains(name)){
          const store = db.createObjectStore(name, { keyPath: 'id' });
          if (name === 'records') store.createIndex('date', 'date');
          if (name === 'bodyMetrics') store.createIndex('recordedAt', 'recordedAt');
        }
      });
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}
async function getDB(){
  if (!dbInstance) dbInstance = await openDB();
  return dbInstance;
}
async function dbGetAll(store){
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbGet(store, id){
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(store, obj){
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = () => resolve(obj);
    tx.onerror = () => reject(tx.error);
  });
}
async function dbBulkPut(store, arr){
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    arr.forEach(o => os.put(o));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDelete(store, id){
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbClear(store){
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ============================== Settings / Draft ============================== */
const SETTINGS_KEY = 'ft_settings';
const DRAFT_KEY = 'ft_draft_session';
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) return Object.assign({ unit:'metric', theme:'auto', language:'zh-TW' }, JSON.parse(raw));
  }catch(e){}
  return { unit:'metric', theme:'auto', language:'zh-TW' };
}
function saveSettings(s){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){}
}
function applyTheme(theme){
  const root = document.documentElement;
  const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.classList.toggle('dark', isDark);
}
function saveDraft(session){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(session)); }catch(e){}
}
function loadDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

  tab: 'home',
  settings: loadSettings(),
  exercises: [], templates: [], tags: [], records: [], bodyMetrics: [],
  exercisesView: { category:'全部', equipment:'全部', search:'', subview:'list', editId:null },
  templatesView: { subview:'list', editId:null, draft:null },
  historyView: { subview:'list', openId:null, editBuffer:null },

  sessionTimerHandle: null,
  pendingExercisePicker: null, // callback for picker modal
};

/* ============================== Init ============================== */
const App = {};
window.App = App;

App.init = async function(){
  applyTheme(State.settings.theme);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (State.settings.theme === 'auto') applyTheme('auto');
  });
  await seedIfEmpty();
  await App.reloadAll();

  const draft = loadDraft();
  if (draft){
    App.showConfirm('偵測到尚未完成的訓練草稿，要繼續上次的訓練嗎？', '未完成的訓練', '繼續', '捨棄').then(ok => {
      if (ok){
        State.session = draft;
        App.startSessionTimer();
        App.render();
      } else {
        clearDraft();
        App.render();
      }
    });
  }
  App.render();
};

App.reloadAll = async function(){
  const [exercises, templates, tags, records, bodyMetrics] = await Promise.all([
    dbGetAll('exercises'), dbGetAll('templates'), dbGetAll('tags'), dbGetAll('records'), dbGetAll('bodyMetrics')
  ]);
  State.exercises = exercises.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  State.templates = templates.sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt));
  State.tags = tags;
  State.records = records.sort((a,b)=> new Date(b.startTime)-new Date(a.startTime));
  State.bodyMetrics = bodyMetrics.sort((a,b)=> new Date(b.recordedAt)-new Date(a.recordedAt));
};

function exerciseById(id){ return State.exercises.find(e=>e.id===id); }
function templateById(id){ return State.templates.find(t=>t.id===id); }

/* ============================== HOME ============================== */
function computeStreakDays(){
  const days = new Set(State.records.map(r => dateKey(r.startTime)));
  let streak = 0;
  let cursor = new Date();
  if (!days.has(dateKey(cursor))){
    cursor.setDate(cursor.getDate()-1);
  }
  while (days.has(dateKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function countThisMonth(){
  const mk = monthKey(new Date());
  return State.records.filter(r => monthKey(r.startTime) === mk).length;
}
function pickMotivation(){
  const count = countThisMonth();
  const streak = computeStreakDays();
  const pools = [...MOTIVATION_BASE];
  if (count > 0) MOTIVATION_COUNT.forEach(m => pools.push(m.replace('{count}', count)));
  if (streak >= 2) MOTIVATION_STREAK.forEach(m => pools.push(m.replace('{streak}', streak)));
  return pools[Math.floor(Math.random()*pools.length)];
}

function templateDiffersFromSession(template, session){
  if (session.exercises.length !== template.exercises.length) return true;
  for (let i=0;i<session.exercises.length;i++){
    const se = session.exercises[i], te = template.exercises[i];
    if (!te || se.exerciseId !== te.exerciseId) return true;
    if (se.variant !== te.variant) return true;
    if (se.sets.length !== te.plannedSets.length) return true;
    for (let j=0;j<se.sets.length;j++){
      const ss = se.sets[j], ts = te.plannedSets[j];
      if (!ts) return true;
      if ((ss.weight||0) !== (ts.weight||0)) return true;
      if ((ss.distance||0) !== (ts.distance||0)) return true;
      if ((ss.reps||0) !== (ts.reps||0)) return true;
    }
  }
  return false;
}

App.finishSession = async function(){
  const s = State.session;
  if (!s.exercises.length){
    App.toast('請至少加入一個動作再完成訓練');
    return;
  }
  let endTime, duration;
  if (s.isBackfill){
    duration = Math.max(1, s.backfillDurationMinutes || 1);
    endTime = new Date(new Date(s.startTime).getTime() + duration*60000).toISOString();
  } else {
    endTime = nowISO();
    duration = Math.max(1, Math.round((new Date(endTime)-new Date(s.startTime))/60000));
  }

  let savedAsTemplateUpdate = false;
  if (s.templateId){
    const currentTemplate = templateById(s.templateId);
    if (currentTemplate && templateDiffersFromSession(currentTemplate, s)){
      const ok = await App.showConfirm('這次訓練的內容和原本的菜單不同，是否要更新這份菜單？', '更新菜單', '更新', '不更新');
      if (ok){
        currentTemplate.exercises = s.exercises.map(se => ({
          exerciseId: se.exerciseId, order: se.order, variant: se.variant,
          plannedSets: se.sets.map(st => ({ setNumber:st.setNumber, weight:st.weight, distance:st.distance, reps:st.reps })),
          notes: se.notes
        }));
        currentTemplate.updatedAt = nowISO();
        await dbPut('templates', currentTemplate);
        savedAsTemplateUpdate = true;
      }
    }
  }

  const record = {
    id: uid(), date: dateKey(s.startTime), startTime: s.startTime, endTime, duration,
    templateId: s.templateId || undefined, templateNameSnapshot: s.templateNameSnapshot || undefined,
    tags: s.tags, exercises: s.exercises.map(se => ({
      exerciseId: se.exerciseId, exerciseNameSnapshot: se.exerciseNameSnapshot, order: se.order,
      variant: se.variant, sets: se.sets, notes: se.notes
    })),
    overallNotes: s.overallNotes, savedAsTemplateUpdate
  };
  await dbPut('records', record);

  for (const tagName of s.tags){
    if (!State.tags.some(t=>t.name===tagName)){
      await dbPut('tags', { id: uid(), name: tagName, createdAt: nowISO() });
    }
  }

  await App.reloadAll();
  clearInterval(State.sessionTimerHandle);
  State.session = null;
  clearDraft();
  App.render();

  if (!record.templateId){
    const saveAsTpl = await App.showConfirm('是否要把這次的訓練內容存成新的菜單，方便下次使用？', '儲存為菜單', '儲存', '不用了');
    if (saveAsTpl){
      App.promptSaveAsTemplate(record);
      return;
    }
  }
  App.toast(pickMotivation(), 3200);
};

function renderHistoryTab(){
  const v = State.historyView;
  if (v.subview === 'detail') return renderHistoryDetail(v.openId);

  const backfillBtn = `<button class="btn btn-primary" style="padding:8px 14px;" onclick="App.openBackfillModal()">+ 補記錄</button>`;

  if (!State.records.length){
    return pageWrap('訓練紀錄', backfillBtn, `<div class="text-sm text-center py-8" style="color:var(--text2)">還沒有任何訓練紀錄</div>`);
  }
  const groups = {};
  State.records.forEach(r => {
    const mk = monthKey(r.startTime);
    (groups[mk] = groups[mk] || []).push(r);
  });
  const html = Object.keys(groups).sort().reverse().map(mk => {
    const [y,m] = mk.split('-');
    const items = groups[mk].map(r => {
      const totalVolume = r.exercises.reduce((sum,e)=>sum + e.sets.reduce((s2,st)=> s2 + (st.completed && st.weight ? st.weight*st.reps : 0),0),0);
      return `
      <div class="card p-3 mb-2" onclick="App.openHistoryDetail('${r.id}')">
        <div class="flex justify-between items-center">
          <div class="font-bold text-sm">${escapeHtml(r.templateNameSnapshot || '空白訓練')}</div>
          <div class="text-xs" style="color:var(--text2)">${fmtDateShort(r.startTime)}</div>
        </div>
        <div class="text-xs mt-1" style="color:var(--text2)">${r.exercises.length} 個動作 · ${fmtDuration(r.duration)}${totalVolume>0?` · 訓練量 ${Math.round(toDisplayWeight(totalVolume))}${weightLabel()}`:''}</div>
        ${r.tags.length ? `<div class="flex gap-1 mt-1.5 flex-wrap">${r.tags.map(t=>`<span class="chip" style="padding:2px 8px;">${escapeHtml(t)}</span>`).join('')}</div>` : ''}

    return `<div class="text-xs font-bold mt-3 mb-1" style="color:var(--text2)">${y}年${parseInt(m)}月</div>${items}`;
  }).join('');

  return pageWrap('訓練紀錄', backfillBtn, html);

App.histUpdateSet = function(idx, si, field, val){
  const r = State.records.find(x=>x.id===State.historyView.openId);
  const s = r.exercises[idx].sets[si];
  if (field==='weight') s.weight = toStoreWeight(val);
  else if (field==='distance') s.distance = toStoreDistance(val);
  else s.reps = parseInt(val)||0;
  dbPut('records', r);
};
App.histToggleComplete = function(idx, si){
  const r = State.records.find(x=>x.id===State.historyView.openId);
  r.exercises[idx].sets[si].completed = !r.exercises[idx].sets[si].completed;
  dbPut('records', r);
  App.render();
};

function rangeStartDate(range){
  const now = new Date();
  if (range==='7d'){ const d=new Date(now); d.setDate(d.getDate()-7); return d; }
  if (range==='30d'){ const d=new Date(now); d.setDate(d.getDate()-30); return d; }
  if (range==='90d'){ const d=new Date(now); d.setDate(d.getDate()-90); return d; }
  if (range==='1y'){ const d=new Date(now); d.setFullYear(d.getFullYear()-1); return d; }
  return null;
}
function recordsInRange(range){
  const start = rangeStartDate(range);
  if (!start) return State.records;
  return State.records.filter(r => new Date(r.startTime) >= start);
}

function renderMonthlyReview(){
  const now = new Date();
  const thisMK = monthKey(now);
  const lastDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMK = monthKey(lastDate);
  const thisRecs = State.records.filter(r=>monthKey(r.startTime)===thisMK);
  const lastRecs = State.records.filter(r=>monthKey(r.startTime)===lastMK);
  const vol = recs => recs.reduce((sum,r)=>sum + r.exercises.reduce((s,e)=>s+e.sets.reduce((s2,st)=>s2+(st.completed&&st.weight?st.weight*st.reps:0),0),0),0);
  const thisVol = vol(thisRecs), lastVol = vol(lastRecs);
  const diff = lastVol>0 ? Math.round(((thisVol-lastVol)/lastVol)*100) : (thisVol>0?100:0);
  const muscleCounts = {};
  thisRecs.forEach(r=>r.exercises.forEach(e=>{
    const ex = exerciseById(e.exerciseId);
    (ex?.muscleGroups||[]).forEach(m=>muscleCounts[m]=(muscleCounts[m]||0)+1);
  }));
  const topMuscle = Object.entries(muscleCounts).sort((a,b)=>b[1]-a[1])[0];
  return `
    <div class="card p-4 mb-4" style="background:linear-gradient(135deg,var(--accent),#eab308); color:#111;border:none;">
      <div class="font-bold mb-2">📅 本月回顧</div>
      <div class="text-sm">本月已訓練 <b>${thisRecs.length}</b> 次${lastRecs.length?`（上月 ${lastRecs.length} 次）`:''}</div>
      <div class="text-sm mt-1">總訓練量較上月 ${diff>=0?'增加':'減少'} <b>${Math.abs(diff)}%</b></div>
      ${topMuscle ? `<div class="text-sm mt-1">最常訓練部位：<b>${escapeHtml(topMuscle[0])}</b></div>` : ''}
      <div class="text-sm mt-2 font-semibold">${escapeHtml(pickMotivation())}</div>
    </div>
  `;
}

function chartColors(n){
  const base = ['#6366f1','#f97316','#22c55e','#ec4899','#06b6d4','#eab308','#a855f7','#ef4444','#14b8a6','#84cc16'];
  const out = []; for (let i=0;i<n;i++) out.push(base[i%base.length]);
  return out;
}
function chartTextColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#111'; }
function chartGridColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#eee'; }

App.initStatsCharts = function(){
  destroyCharts();
  const recs = recordsInRange(State.statsView.range);
  const textColor = chartTextColor(), gridColor = chartGridColor();

  // 訓練次數（依週分組）
  const freqMap = {};
  recs.forEach(r => { const wk = isoWeekKey(r.startTime); freqMap[wk] = (freqMap[wk]||0)+1; });
  const freqKeys = Object.keys(freqMap).sort();
  chartInstances.freq = new Chart(document.getElementById('chartFrequency'), {
    type: 'bar',
    data: { labels: freqKeys, datasets: [{ label:'訓練次數', data: freqKeys.map(k=>freqMap[k]), backgroundColor:'#6366f1', borderRadius:6 }] },
    options: { plugins:{ legend:{display:false} }, scales:{ x:{ ticks:{color:textColor}, grid:{color:gridColor} }, y:{ beginAtZero:true, ticks:{color:textColor, precision:0}, grid:{color:gridColor} } } }
  });

  // 部位分佈
  const muscleMap = {};
  recs.forEach(r => r.exercises.forEach(e => {
    const ex = exerciseById(e.exerciseId);
    (ex?.muscleGroups||[]).forEach(m => muscleMap[m]=(muscleMap[m]||0)+1);
  }));
  const muscleKeys = Object.keys(muscleMap);
  chartInstances.muscle = new Chart(document.getElementById('chartMuscle'), {
    type: 'pie',
    data: { labels: muscleKeys, datasets: [{ data: muscleKeys.map(k=>muscleMap[k]), backgroundColor: chartColors(muscleKeys.length) }] },
    options: { plugins:{ legend:{ position:'bottom', labels:{color:textColor, boxWidth:12, font:{size:10} } } } }
  });

  // 最大重量趨勢 & 訓練量趨勢
  const exId = State.statsView.exerciseId;
  let mwLabels=[], mwData=[], volLabels=[], volData=[];
  if (exId){
    const relevant = recs.filter(r=>r.exercises.some(e=>e.exerciseId===exId)).sort((a,b)=>new Date(a.startTime)-new Date(b.startTime));
    relevant.forEach(r => {
      const e = r.exercises.find(x=>x.exerciseId===exId);
      const maxW = Math.max(0, ...e.sets.filter(s=>s.completed).map(s=>s.weight||0));
      const vol = e.sets.filter(s=>s.completed).reduce((sum,s)=>sum+(s.weight||0)*(s.reps||0),0);
      mwLabels.push(fmtDateShort(r.startTime)); mwData.push(Math.round(toDisplayWeight(maxW)*100)/100);
      volLabels.push(fmtDateShort(r.startTime)); volData.push(Math.round(toDisplayWeight(vol)*100)/100);
    });
  }
  chartInstances.maxWeight = new Chart(document.getElementById('chartMaxWeight'), {
    type: 'line',
    data: { labels: mwLabels, datasets: [{ label:`最大重量 (${weightLabel()})`, data: mwData, borderColor:'#f97316', backgroundColor:'#f97316', tension:.3 }] },
    options: { plugins:{ legend:{display:false} }, scales:{ x:{ ticks:{color:textColor}, grid:{color:gridColor} }, y:{ ticks:{color:textColor}, grid:{color:gridColor} } } }
  });
  chartInstances.volume = new Chart(document.getElementById('chartVolume'), {
    type: 'line',
    data: { labels: volLabels, datasets: [{ label:`訓練量 (${weightLabel()})`, data: volData, borderColor:'#22c55e', backgroundColor:'#22c55e', tension:.3 }] },
    options: { plugins:{ legend:{display:false} }, scales:{ x:{ ticks:{color:textColor}, grid:{color:gridColor} }, y:{ ticks:{color:textColor}, grid:{color:gridColor} } } }
  });

  // 體重/體脂
  const bms = [...State.bodyMetrics].sort((a,b)=>new Date(a.recordedAt)-new Date(b.recordedAt));
  chartInstances.body = new Chart(document.getElementById('chartBody'), {
    type: 'line',
    data: { labels: bms.map(m=>fmtDateShort(m.recordedAt)), datasets: [
      { label:`體重 (${weightLabel()})`, data: bms.map(m=>toDisplayWeight(m.weight)), borderColor:'#6366f1', backgroundColor:'#6366f1', tension:.3, yAxisID:'y' },
      { label:'體脂 (%)', data: bms.map(m=>m.bodyFat===undefined||m.bodyFat===null?null:m.bodyFat), borderColor:'#ec4899', backgroundColor:'#ec4899', tension:.3, yAxisID:'y1' },
    ] },
    options: { plugins:{ legend:{labels:{color:textColor}} }, scales:{
      x:{ ticks:{color:textColor}, grid:{color:gridColor} },
      y:{ position:'left', ticks:{color:textColor}, grid:{color:gridColor} },
      y1:{ position:'right', ticks:{color:textColor}, grid:{drawOnChartArea:false} },
    } }
  });
};

      <div class="font-bold text-sm mb-2">備份與還原</div>
      <div class="text-xs mb-3" style="color:var(--text2)">所有資料僅儲存在此裝置上，建議定期匯出備份，避免清除瀏覽器資料或更換裝置時遺失紀錄。</div>
      <div class="flex gap-2">
        <button class="btn btn-primary flex-1" onclick="App.exportData()">匯出備份</button>
        <button class="btn btn-secondary flex-1" onclick="document.getElementById('importFile').click()">匯入備份</button>
      </div>
      <input type="file" id="importFile" accept="application/json" class="hidden" onchange="App.importData(event)">
    </div>

    <div class="text-center text-xs mt-6" style="color:var(--text2)">健身訓練追蹤 App · v1.0 · 純本地儲存</div>
  `);
}
App.setUnit = function(u){ State.settings.unit = u; saveSettings(State.settings); App.render(); };
App.setTheme = function(t){ State.settings.theme = t; saveSettings(State.settings); applyTheme(t); App.render(); };
App.addTag = async function(){
  const input = document.getElementById('newTagInput');
  const name = input.value.trim();
  if (!name) return;
  if (State.tags.some(t=>t.name===name)){ App.toast('標籤已存在'); return; }
  await dbPut('tags', { id: uid(), name, createdAt: nowISO() });
  await App.reloadAll();
  App.render();
};
App.deleteTag = async function(id){
  await dbDelete('tags', id);
  await App.reloadAll();
  App.render();
};

App.exportData = async function(){
  const [exercises, templates, records, bodyMetrics, tags] = await Promise.all([
    dbGetAll('exercises'), dbGetAll('templates'), dbGetAll('records'), dbGetAll('bodyMetrics'), dbGetAll('tags')
  ]);
  const payload = {
    exportedAt: nowISO(), version: 1,
    settings: State.settings,
    exercises, templates, records, bodyMetrics, tags
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fitness-backup-${dateKey(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  App.toast('已匯出備份檔案');
};
App.importData = function(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ App.toast('檔案格式錯誤，無法匯入'); return; }
    if (!data || typeof data !== 'object'){ App.toast('檔案內容無效'); return; }
    const ok = await App.showConfirm('匯入將會覆蓋目前裝置上的所有資料，確定要繼續嗎？', '匯入備份', '匯入', '取消');
    if (!ok){ event.target.value=''; return; }
    try{
      await Promise.all(STORES.map(s => dbClear(s)));
      if (Array.isArray(data.exercises)) await dbBulkPut('exercises', data.exercises);
      if (Array.isArray(data.templates)) await dbBulkPut('templates', data.templates);
      if (Array.isArray(data.records)) await dbBulkPut('records', data.records);
      if (Array.isArray(data.bodyMetrics)) await dbBulkPut('bodyMetrics', data.bodyMetrics);
      if (Array.isArray(data.tags)) await dbBulkPut('tags', data.tags);
      if (data.settings){ State.settings = Object.assign(loadSettings(), data.settings); saveSettings(State.settings); applyTheme(State.settings.theme); }
      await seedIfEmpty();
      await App.reloadAll();
      App.toast('匯入完成');
      App.render();
    }catch(err){
      App.toast('匯入過程發生錯誤');
      console.error(err);
    }
    event.target.value='';
  };
  reader.readAsText(file);
};

/* ============================== Start ============================== */
document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
</body>
</html>
